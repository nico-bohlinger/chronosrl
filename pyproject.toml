[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chronosrl"
version = "0.0.1"
description = "ChronoSRL: Temporal Geometry for Self-Supervised Reinforcement Learning"
authors = [{name = "Nico Bohlinger", email = "nico.bohlinger@gmail.com"}]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "absl-py",
    "ml-collections",
    "wandb",
]

[project.optional-dependencies]
benchmark = [
    "jax==0.4.23",
    "jaxlib==0.4.23",
    "flax==0.7.4",
    "optax==0.2.2",
    "chex==0.1.86",
    "orbax-checkpoint==0.5.16",
    "brax==0.10.1",
    "mujoco==3.2.6",
    "mujoco-mjx==3.2.6",
    "numpy==1.26.4",
    "scipy==1.12.0",
]
go2 = [
    "jax==0.7.2",
    "jaxlib==0.7.2",
    "flax==0.12.0",
    "optax==0.2.8",
    "chex==0.1.92",
    "mujoco==3.7.0",
    "mujoco-mjx==3.7.0",
    "mujoco-warp==3.7.0.1",
    "warp-lang==1.12.1",
    "dm_control>=1.0.39",
    "numpy==2.4.6",
    "scipy==1.17.1",
]

[tool.setuptools.packages.find]
include = ["chronosrl*"]

[tool.setuptools.package-data]
"*" = ["*.xml", "assets/*.xml", "LICENSE"]
